# Runs on every push and pull request, so a change can only be merged when
# the analysis and all the automated tests pass.
name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # The local database tests run on SQLite through FFI.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  security-rules:
    name: Firestore and Storage rules tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # The Firebase emulators need Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@15.32.1

      - name: Install dependencies
        run: npm ci

      - name: Rules tests on the Local Emulator Suite
        run: npm test
