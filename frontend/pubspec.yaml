name: news_app_clean_architecture
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # Sidebar
  awesome_drawer_bar: ^1.2.1

  # icon
  ionicons: ^0.2.3

  # state management
  flutter_bloc: ^9.1.1

  # comparing dart objects
  equatable: ^2.1.0

  # service locator
  get_it: ^9.3.0
  injectable: ^2.3.2

  # dateFormat
  intl: ^0.20.3

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # http client
  dio: ^5.8.0+1

  # make request to api (runtime only; generated code is kept in source control)
  retrofit: ^4.10.0

  # Firebase
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

  # Hooks
  flutter_hooks: ^0.21.3+1

  # cached image
  cached_network_image: ^4.0.2
  firebase_auth: ^6.7.0

  # logging
  logging: ^1.2.0

  # JSON serialization
  json_annotation: ^4.9.0
  image_picker: ^1.2.3
  gpt_markdown: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  firebase_auth_mocks: ^0.15.2
  injectable_generator: ^2.6.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3
  mockito: ^5.4.4
  bloc_test: ^10.0.0
  json_serializable: ^6.9.0
  drift_dev: ^2.22.1
  retrofit_generator: ^10.2.9



flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:

  uses-material-design: true

  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
