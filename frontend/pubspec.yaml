name: news_app_clean_architecture
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  #state management
  flutter_bloc: ^9.1.1

  #comparing dart objects
  equatable: ^3.0.0

  #service locator
  get_it: ^9.3.0
  
  #dateFormat
  intl: ^0.20.2

  # Firebase
  firebase_core: ^5.0.0
  cloud_firestore: ^7.0.0
  firebase_storage: ^14.0.0
  firebase_auth: ^7.0.0

  #cached image
  cached_network_image: ^4.0.3

  #rich text editor
  flutter_quill: ^11.6.0

  #gallery images
  image_picker: ^1.2.4

  #translations of material and editor widgets
  flutter_localizations:
    sdk: flutter

  #stream operators, such as switchMap
  rxdart: ^0.28.0

  #unique names for uploaded files
  uuid: ^4.6.0

  #local settings
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:

  uses-material-design: true

 
  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
