name: news_app_clean_architecture
description: Case Study Symmetry news and community publishing app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ionicons: ^0.2.2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  intl: ^0.19.0
  floor: ^1.5.0
  sqflite: ^2.3.3+2
  retrofit: 4.4.2
  dio: ^5.8.0+1
  crypto: ^3.0.3
  firebase_core: ^3.13.1
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.4.6
  firebase_auth: ^5.5.4
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  flutter_hooks: ^0.20.5
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  crop_your_image: ^2.0.0
  share_plus: ^10.1.4
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  retrofit_generator: 9.1.9
  floor_generator: ^1.5.0
  build_runner: ^2.4.15
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
