name: news_app_clean_architecture
description: A Firebase-backed news app (Clean Architecture + BLoC) — create, draft, publish and read articles with comments, search and i18n.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.16.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2

  #state management
  flutter_bloc: ^8.1.2

  #comparing dart objects
  equatable: ^2.0.5

  #service locator
  get_it: ^7.6.0
  
  #dateFormat
  intl: ^0.20.2

  #Database
  floor: any

  #make request to api
  retrofit: ^3.0.1

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0


  #Hooks
  flutter_hooks: ^0.18.3

  #chached image
  cached_network_image: ^3.2.0

  #image picker
  image_picker: ^0.8.9

  #skeleton loading
  shimmer: ^3.0.0

  #bloc event transformers
  bloc_concurrency: ^0.2.2
  google_fonts: ^8.1.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
  retrofit_generator: ^4.0.0
  floor_generator: ^1.4.0
  build_runner: ^2.4.0
  mocktail: ^1.0.5
  

flutter:
  generate: true
  uses-material-design: true
  # Fonts (Libre Baskerville + Mulish) are loaded at runtime via google_fonts.
