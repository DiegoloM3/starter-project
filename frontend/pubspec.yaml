name: news_app_clean_architecture
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Built-in i18n delegates required by flutter gen-l10n output.
  flutter_localizations:
    sdk: flutter

  # Persist user locale preference across app launches.
  shared_preferences: ^2.3.0

  # SHA-1 of article URL → stable Firestore doc ID for saved articles.
  crypto: ^3.0.0

  cupertino_icons: ^1.0.9

  #icon
  ionicons: ^0.2.2

  #state management
  flutter_bloc: ^9.0.0

  #comparing dart objects
  equatable: ^2.0.8

  #service locator
  get_it: ^7.7.0

  #dateFormat
  intl: ^0.20.0

  #Database — sqflite 2.4+ splits Android code into sqflite_android (v2 embedding only).
  # 2.3.x has v1 embedding remnants that fail to compile against modern Flutter.
  floor: ^1.5.0
  sqflite: ^2.4.0

  #make request to api
  # Note: retrofit 3.x is the last version requiring dio ^4.x.
  # retrofit_generator/floor_generator are excluded from dev_deps because
  # their analyzer pins conflict with bloc_test. Generated .g.dart files
  # are pre-committed. Codegen tools can be restored when needed.
  retrofit: ^3.0.1
  dio: ^4.0.0

  # Firebase — versions 4.x/6.x/13.x include fix for non-modular Firebase.h umbrella
  # bug present in firebase_storage <=12.3.1 with iOS 18 / Xcode 16+.
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_auth: ^6.0.0
  cloud_functions: ^6.2.0

  # Routing
  go_router: ^14.6.0

  # Google Sign-In
  google_sign_in: ^6.2.0

  #Hooks
  flutter_hooks: ^0.21.0

  #cached image
  cached_network_image: ^3.4.0

  flutter_image_compress: ^2.3.0
  image_cropper: ^12.2.1
  image_picker: ^1.1.2

  # Explicit pin to force modern path_provider_android (transitive default 2.2.2
  # uses removed Flutter v1 embedding API and breaks Android build).
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.0
  sqflite_common_ffi: ^2.3.0
  integration_test:
    sdk: flutter
  fake_cloud_firestore: ^4.1.0+1
  firebase_storage_mocks: ^0.8.0+1

# Forces newer win32 to replace 5.3.0 brought in transitively by path_provider_windows.
# 5.3.0 references UnmodifiableUint8ListView which was removed from dart:typed_data
# in Dart 3.5+. We never run on Windows; this only unblocks the kernel snapshot.
dependency_overrides:
  win32: ^5.5.4


flutter:

  uses-material-design: true
  generate: true


  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
