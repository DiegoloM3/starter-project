name: news_app_clean_architecture
description: Daily News, where journalists read the news and publish their own articles.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  #icon
  ionicons: ^0.2.3

  #state management
  flutter_bloc: ^9.1.1

  #comparing dart objects
  equatable: ^2.0.7

  #service locator
  get_it: ^9.3.0
  
  #dateFormat
  intl: ^0.20.3

  #Database
  floor: ^1.5.0
  sqflite: ^2.4.4

  #make request to api
  dio: ^5.11.1

  # Firebase
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0


  #chached image 
  cached_network_image: ^4.0.4
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  skeletonizer: ^3.0.0
  firebase_auth: ^6.7.0
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  floor_generator: ^1.5.0
  build_runner: ^2.4.13
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  

flutter:

  uses-material-design: true

 
  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
