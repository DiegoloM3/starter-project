name: news_app_clean_architecture
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2

  #state management
  flutter_bloc: ^8.1.2

  #comparing dart objects
  equatable: ^2.0.5

  #service locator
  get_it: ^7.6.0
  
  #dateFormat
  intl: ^0.20.2

  #Database
  # Imported directly by the Floor database class and by its generated code.
  sqflite: ^2.3.0
  floor: ^1.4.2

  #make request to api
  retrofit: ^4.1.0
  dio: ^5.4.0

  # Firebase
  # Kept current on purpose: the versions inherited from the starter project
  # (firebase_auth 4.x) hit the "PigeonUserDetails" decoding bug, where the
  # native Android SDK answers in a shape the Dart codec cannot read.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0


  #Hooks
  flutter_hooks: ^0.18.3

  #chached image 
  cached_network_image: ^3.2.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Generates the launcher icons for every density from one drawing, so the
  # icon has a single source (assets/branding/app_icon.svg) instead of a
  # folder of hand-exported PNGs that drift apart.
  flutter_launcher_icons: ^0.14.1
  retrofit_generator: ^8.2.1
  floor_generator: ^1.4.2
  build_runner: ^2.4.13
  

# The launcher icon, generated from the mark drawn in
# assets/branding/app_icon.svg. `dart run flutter_launcher_icons` regenerates
# every density after a change to it.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  # Android 8+ crops the icon to the launcher's own shape and only guarantees
  # the middle of it survives, so the bars are supplied on their own over a
  # flat violet rather than as a pre-cropped tile.
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png

flutter:

  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb. This runs through the
  # flutter tool rather than build_runner, which is why it works while code
  # generation is otherwise blocked (see docs/DECISIONS.md decision #19).
  generate: true

 
  fonts:
    # Bundled rather than fetched at runtime, so the app looks the same on a
    # plane as it does on wifi. Inter ships as a variable font; the weights
    # are selected with fontVariations in app_themes.dart.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf

    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
