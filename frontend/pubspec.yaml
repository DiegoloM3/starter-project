name: news_app_clean_architecture
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2

  #icon
  ionicons: ^0.1.2

  #state management
  flutter_bloc: ^9.1.1

  #comparing dart objects
  equatable: ^2.0.5

  #service locator
  get_it: 9.2.1
  
  #dateFormat
  intl: ^0.20.2

  #Database
  froom: 6.0.0
  sqflite: 2.4.2

  #make request to api
  retrofit: 4.9.2
  dio: 5.9.2

  # Firebase
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0

  #Environment variables
  flutter_dotenv: ^5.2.1

  #Hooks
  flutter_hooks: ^0.18.3

  #chached image
  cached_network_image: ^3.4.1

  #fonts
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  retrofit_generator: ^10.2.5
  froom_generator: 6.0.0
  build_runner: 2.13.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env