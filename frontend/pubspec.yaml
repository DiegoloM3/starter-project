name: news_app_clean_architecture
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  #icon
  ionicons: ^0.1.2

  #state management
  flutter_bloc: ^8.1.2

  #comparing dart objects
  equatable: ^2.0.5

  #service locator
  get_it: ^7.6.0
  
  #dateFormat
  intl: ^0.18.1

  #Database
  floor: any

  #make request to api
  retrofit: ^3.0.1
  dio: ^4.0.6

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_app_check: ^0.3.0

  # Environment Variables
  flutter_dotenv: ^5.0.2

  #Hooks
  flutter_hooks: ^0.18.3

  #chached image 
  cached_network_image: ^3.2.0

  #url launcher
  url_launcher: ^6.2.1

  #Text to Speech
  flutter_tts: ^3.8.5

  #Image picker for article cover
  image_picker: ^1.0.7

  #Secure local storage
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
  # Note: retrofit_generator and floor_generator temporarily removed due to 
  # compatibility issues with newer Dart versions
  # retrofit_generator: 3.0.1+1
  # floor_generator: 1.2.0
  build_runner: ^2.4.8
  
  # Testing
  mockito: ^5.4.4
  bloc_test: ^9.1.5
  

flutter:

  uses-material-design: true

  assets:
    - .env
 
  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
