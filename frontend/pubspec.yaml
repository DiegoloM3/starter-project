name: news_app_clean_architecture
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  #icon
  ionicons: ^0.2.2

  #state management
  flutter_bloc: ^9.1.1

  #comparing dart objects
  equatable: ^3.0.0

  #service locator
  get_it: ^9.3.0
  
  #dateFormat
  intl: ^0.20.3

  #Database
  floor: any

  #make request to api
  retrofit: ^4.10.0

  # Firebase
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0


  #SQLlite
  sqflite: ^2.4.2+1


  #Hooks
  flutter_hooks: ^0.21.3+1

  #chached image 
  cached_network_image: ^3.2.0


  #Navigation routes
  go_router: ^17.5.0

  #Http client
  dio: ^5.11.1

  #Image picker
  image_picker: ^1.2.3

  #Bloc pattern
  bloc: ^9.2.1

  #Analyzer annotations
  meta: ^1.17.0

  #Google's fonts
  google_fonts: ^8.2.1

  #Connectivity
  connectivity_plus: ^7.3.1

  #Image cropper
  image_cropper: ^12.2.1

  #User's preferences
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.7



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^8.2.1
  floor_generator: ^1.5.0
  build_runner: ^2.4.13
  

flutter:

  uses-material-design: true
 
  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300

  assets:
    - assets/splash/


flutter_native_splash:
  color: "#F7F4EC"
  color_dark: "#201D1A"

  image: assets/splash/splash_logo.png
  image_dark: assets/splash/splash_logo_dark.png   

  android_12:
    color: "#F7F4EC"
    color_dark: "#201D1A"
    image: assets/splash/splash_logo.png
    image_dark: assets/splash/splash_logo_dark.png 

  android: true
  ios: false
  web: false