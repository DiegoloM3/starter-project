name: news_app_clean_architecture
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  #icon
  ionicons: ^0.2.2

  #state management
  flutter_bloc: ^9.1.1

  #comparing dart objects
  equatable: ^3.0.0

  #service locator
  get_it: ^9.3.0
  
  #dateFormat
  intl: ^0.20.2
  # Flutter's own English/Spanish translations of built-in widgets (dialog
  # buttons, date pickers); our strings come from lib/l10n via gen-l10n.
  flutter_localizations:
    sdk: flutter

  #Database
  floor: any

  #make request to api
  retrofit: ^4.10.0
  # dio was always used directly by core/resources/data_state.dart (DioException)
  # but only ever arrived transitively via retrofit. Declaring it explicitly
  # since our own code depends on its public API, not just retrofit's.
  dio: ^5.11.1

  # Firebase
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  # Anonymous Auth -- resolved decision, see backend/docs/DB_SCHEMA.md
  firebase_auth: ^6.2.0
  # Lets the user pick a real device photo to upload to Cloud Storage for
  # thumbnailURL, instead of pasting an arbitrary external URL -- without this
  # the "thumbnailURL must reference Cloud Storage" requirement isn't actually met.
  image_picker: ^1.1.2


  #Hooks
  flutter_hooks: ^0.21.3+1

  #chached image 
  cached_network_image: ^3.2.0
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1
  share_plus: ^13.3.0
  google_sign_in: ^7.2.0

  # Imported directly by app_database.dart; version pinned in dependency_overrides.
  sqflite: any
  # Opens a NewsAPI story's full text in the browser ("Read full article"):
  # the free plan only returns its first ~200 characters.
  url_launcher: ^6.3.2
  # The OS pushes connectivity changes to us instead of us polling for
  # them -- what lets the offline banner react the moment a connection
  # drops mid-read, not only the next time something happens to fetch.
  connectivity_plus: ^7.3.1
  # Loads the NewsAPI key from a local, gitignored .env instead of it
  # being a literal in source -- see constants.dart and .env.template.
  flutter_dotenv: ^6.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^8.2.1
  floor_generator: ^1.5.0
  build_runner: ^2.4.13

# The whole path_provider plugin family (pulled in transitively, likely via
# floor/sqflite_common_ffi, not declared directly) was stuck on pre-Dart-3.11
# versions: win32 5.3.0 failed to compile outright; path_provider_windows
# 2.2.1 expected win32's old API; path_provider_android 2.2.2 still used the
# Flutter v1 plugin embedding, which was removed. `flutter pub upgrade
# --major-versions` bumped direct dependencies but left these untouched since
# nothing in the new graph strictly required newer ones. Forcing the whole
# family to current versions unblocks the build.
dependency_overrides:
  win32: ^6.4.0
  path_provider: ^2.1.6
  path_provider_android: ^2.3.1
  path_provider_windows: ^2.3.0
  # Pinned exactly, not ^: sqflite >=2.4.3 requires Dart >=3.12.0, but the
  # installed SDK is 3.11.1. 2.4.2+1 is the newest version below that wall,
  # and already dropped the old v1 plugin embedding (removed in 2.3.3+2).
  sqflite: 2.4.2+1


flutter:

  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  # Not committed (see .gitignore) -- copy .env.template to .env and fill
  # in your own NewsAPI key to run this project locally.
  assets:
    - .env

  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
    # Bundled locally instead of google_fonts' runtime network fetch,
    # specifically for BrandMark: it's on screen constantly (every image
    # placeholder, app-wide) and google_fonts falling back to a different
    # font while Newsreader is still downloading -- or failing to download
    # at all, e.g. mid connectivity test -- showed up as the "N" sometimes
    # rendering as a different-looking glyph. The rest of the app's
    # Newsreader/Plus Jakarta Sans/Inter text still goes through
    # google_fonts and carries the same small risk, not bundled here to
    # keep this fix scoped to the reported symptom.
    - family: NewsreaderLocal
      fonts:
        - asset: assets/fonts/newsreader/Newsreader-Bold.ttf
          weight: 700
