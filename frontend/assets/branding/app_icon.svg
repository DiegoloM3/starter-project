<!--
  The Byline mark: a headline and the byline under it.

  It is the same drawing as AppBrandMark in
  lib/shared/ui/presentation/widgets/app_brand.dart — the two are kept in step
  by hand, because the launcher icon is generated from a raster of this file
  while the in-app mark is painted. Coordinates are on a 100x100 grid so both
  read the same way.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <rect width="100" height="100" rx="24" ry="24" fill="#7C3AED"/>
  <rect x="24" y="36" width="52" height="9" rx="4.5" fill="#FFFFFF"/>
  <rect x="24" y="55" width="30" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.62"/>
</svg>
